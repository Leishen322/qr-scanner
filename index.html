<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>더채움 출석체크</title>
<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #1a1a1a;
    --surface2: #2a2a2a;
    --accent: #4ade80;
    --accent-dim: rgba(74,222,128,0.15);
    --text: #f0f0f0;
    --text-dim: #888;
    --danger: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  .header {
    width: 100%;
    max-width: 432px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    display: inline-block;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .scan-count {
    font-size: 14px;
    color: var(--text-dim);
    background: var(--surface);
    padding: 6px 14px;
    border-radius: 20px;
  }
  .scan-count span { color: var(--accent); font-weight: 700; }

  /* 설정 버튼 */
  .settings-btn {
    width: 36px; height: 36px;
    background: var(--surface);
    border: none;
    border-radius: 10px;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .settings-btn:active { background: var(--surface2); }

  /* 설정 패널 */
  .settings-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .settings-panel.open { display: flex; }
  .settings-sheet {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 432px;
    padding: 20px 20px 32px;
    animation: sheetUp 0.3s ease-out;
  }
  @keyframes sheetUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .settings-sheet h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .settings-sheet .close-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 22px;
    cursor: pointer;
    padding: 4px;
  }
  .sound-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--bg);
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s;
  }
  .sound-option.active { border-color: var(--accent); }
  .sound-option:active { background: var(--surface2); }
  .sound-option .sound-info { flex: 1; }
  .sound-option .sound-name { font-size: 14px; font-weight: 600; }
  .sound-option .sound-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .sound-option .play-btn {
    width: 36px; height: 36px;
    background: var(--accent-dim);
    border: none;
    border-radius: 8px;
    color: var(--accent);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sound-option .play-btn:active { background: var(--accent); color: #000; }
  .sound-option .check {
    width: 20px;
    color: var(--accent);
    font-size: 16px;
    text-align: center;
  }

  .scanner-wrap {
    position: relative;
    width: 100%;
    max-width: 432px;
    padding: 0 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .scanner-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    max-height: 55vh;
    border-radius: 20px;
    overflow: hidden;
    background: #111;
    border: 2px solid var(--surface2);
  }

  #reader {
    width: 100%;
    height: 100%;
  }
  #reader video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 18px;
  }

  .scan-line {
    position: absolute;
    left: 10%; right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    top: 20%;
    animation: scanMove 2.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 10;
    box-shadow: 0 0 12px var(--accent);
  }
  @keyframes scanMove {
    0%, 100% { top: 20%; }
    50% { top: 78%; }
  }

  .flash-overlay {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    border-radius: 18px;
  }
  .flash-overlay.flash {
    animation: flashAnim 0.3s ease-out;
  }
  @keyframes flashAnim {
    0% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  .scanner-container.scanned {
    animation: borderGlow 0.6s ease-out;
  }
  @keyframes borderGlow {
    0% { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-dim); }
    100% { border-color: var(--surface2); box-shadow: none; }
  }

  .status {
    margin-top: 16px;
    font-size: 14px;
    text-align: center;
    min-height: 20px;
    transition: color 0.2s;
  }
  .status.ready { color: var(--text-dim); }
  .status.success { color: var(--accent); font-weight: 600; }
  .status.error { color: var(--danger); font-weight: 600; }
  .status.loading { color: var(--text-dim); }

  .toast-container {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 100;
    padding-top: env(safe-area-inset-top, 12px);
    pointer-events: none;
  }

  .toast {
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: 16px;
    padding: 14px 18px;
    margin: 6px 16px;
    width: calc(100% - 32px);
    max-width: 400px;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: toastIn 0.35s ease-out;
    pointer-events: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.out { animation: toastOut 0.3s ease-in forwards; }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(-20px) scale(0.95); }
  }

  .toast .icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .toast .icon.ok { background: var(--accent-dim); }
  .toast .icon.err { background: rgba(248,113,113,0.15); }
  .toast .icon.dup { background: rgba(251,191,36,0.15); }

  .toast .msg {
    font-size: 14px;
    line-height: 1.4;
    color: var(--text);
  }

  .permission-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 30px;
    text-align: center;
    max-width: 360px;
  }
  .perm-icon {
    font-size: 64px;
    margin-bottom: 24px;
  }
  .perm-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .perm-desc {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .start-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 14px 40px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .start-btn:active { transform: scale(0.96); }

  #reader__dashboard, #reader__status_span,
  #reader__header_message, #reader__filescan_input,
  #reader img[alt="Info icon"] { display: none !important; }
  #reader__scan_region { min-height: unset !important; }
</style>
</head>
<body>

<div id="permScreen" class="permission-screen">
  <div class="perm-icon">📸</div>
  <div class="perm-title">카메라 권한이 필요해요</div>
  <div class="perm-desc">학생 출석 QR코드를 인식하려면<br>카메라 접근을 허용해주세요.</div>
  <button class="start-btn" onclick="requestCamera()">카메라 켜기</button>
</div>

<div id="mainUI" style="display:none; flex-direction:column; flex:1; width:100%; align-items:center;">
  <div class="header">
    <h1><span class="dot"></span>더채움 출석체크</h1>
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="scan-count">출석 <span id="countNum">0</span>명</div>
      <button class="settings-btn" onclick="openSettings()">⚙</button>
    </div>
  </div>

  <div class="scanner-wrap">
    <div class="scanner-container" id="scannerBox">
      <div id="reader"></div>
      <div class="scan-line"></div>
      <div class="flash-overlay" id="flashOverlay"></div>
    </div>
    <div id="status" class="status ready">QR코드를 카메라에 비춰주세요</div>
  </div>

  <!-- 설정 패널 -->
  <div class="settings-panel" id="settingsPanel" onclick="if(event.target===this)closeSettings()">
    <div class="settings-sheet">
      <h3>
        소리 설정
        <button class="close-btn" onclick="closeSettings()">✕</button>
      </h3>
      <div id="soundOptions"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

// ── 출석 카운트 자동 초기화 ──
function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function loadCount() {
  const saved = localStorage.getItem('qr_attend');
  if (!saved) return 0;
  try {
    const obj = JSON.parse(saved);
    return obj.date === getTodayStr() ? (obj.count || 0) : 0;
  } catch(e) { return 0; }
}

function saveCount(n) {
  localStorage.setItem('qr_attend', JSON.stringify({ date: getTodayStr(), count: n }));
}

function scheduleMidnightReset() {
  const now = new Date();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
  const ms = midnight - now;
  setTimeout(function() {
    scanCount = 0;
    document.getElementById('countNum').textContent = '0';
    saveCount(0);
    scheduleMidnightReset();
  }, ms);
}

// ── 오디오 ──
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// ── 소리 목록 ──
const SOUNDS = [
  {
    id: 'shutter',
    name: '셔터',
    desc: '카메라 찰칵',
    play: function() {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(1800, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
      osc.start(); osc.stop(ctx.currentTime + 0.12);
    }
  },
  {
    id: 'beep',
    name: '삐',
    desc: '짧은 비프음',
    play: function() {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1000, ctx.currentTime);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start(); osc.stop(ctx.currentTime + 0.15);
    }
  },
  {
    id: 'ding',
    name: '딩동',
    desc: '맑은 벨소리',
    play: function() {
      const ctx = getAudioCtx();
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();
      osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
      osc1.type = 'sine'; osc2.type = 'sine';
      osc1.frequency.setValueAtTime(880, ctx.currentTime);
      osc2.frequency.setValueAtTime(1320, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc1.start(); osc1.stop(ctx.currentTime + 0.15);
      osc2.start(ctx.currentTime + 0.12); osc2.stop(ctx.currentTime + 0.4);
    }
  },
  {
    id: 'coin',
    name: '코인',
    desc: '게임 코인 효과',
    play: function() {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(988, ctx.currentTime);
      osc.frequency.setValueAtTime(1319, ctx.currentTime + 0.07);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.start(); osc.stop(ctx.currentTime + 0.25);
    }
  },
  {
    id: 'chime',
    name: '차임',
    desc: '부드러운 알림음',
    play: function() {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start(); osc.stop(ctx.currentTime + 0.5);
    }
  },
  {
    id: 'pop',
    name: '팝',
    desc: '톡 터지는 소리',
    play: function() {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.06);
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.start(); osc.stop(ctx.currentTime + 0.08);
    }
  },
  {
    id: 'none',
    name: '무음',
    desc: '소리 없이 진동만',
    play: function() {}
  }
];

// 저장된 설정 불러오기
let currentSound = localStorage.getItem('qr_sound') || 'ding';

function openSettings() {
  const panel = document.getElementById('settingsPanel');
  const container = document.getElementById('soundOptions');
  container.innerHTML = '';

  SOUNDS.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sound-option' + (s.id === currentSound ? ' active' : '');
    div.onclick = function(e) {
      if (e.target.closest('.play-btn')) return;
      currentSound = s.id;
      localStorage.setItem('qr_sound', s.id);
      document.querySelectorAll('.sound-option').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
      // 체크마크 업데이트
      document.querySelectorAll('.sound-option .check').forEach(el => el.textContent = '');
      div.querySelector('.check').textContent = '✓';
    };
    div.innerHTML = `
      <div class="check">${s.id === currentSound ? '✓' : ''}</div>
      <div class="sound-info">
        <div class="sound-name">${s.name}</div>
        <div class="sound-desc">${s.desc}</div>
      </div>
      <button class="play-btn" onclick="previewSound('${s.id}')">▶</button>
    `;
    container.appendChild(div);
  });

  panel.classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsPanel').classList.remove('open');
}

function previewSound(id) {
  const s = SOUNDS.find(x => x.id === id);
  if (s) s.play();
}

function playCurrentSound() {
  const s = SOUNDS.find(x => x.id === currentSound);
  if (s) s.play();
}

function triggerCaptureEffect() {
  const flash = document.getElementById('flashOverlay');
  flash.classList.remove('flash');
  void flash.offsetWidth;
  flash.classList.add('flash');

  const box = document.getElementById('scannerBox');
  box.classList.remove('scanned');
  void box.offsetWidth;
  box.classList.add('scanned');

  if (navigator.vibrate) navigator.vibrate(80);
  playCurrentSound();
}

let scanner = null;
let scanCount = 0;
let isProcessing = false;
const scannedSet = new Set();

function showToast(type, message) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';

  let iconClass, iconEmoji;
  if (type === 'ok') { iconClass = 'ok'; iconEmoji = '✅'; }
  else if (type === 'dup') { iconClass = 'dup'; iconEmoji = '⚠️'; }
  else { iconClass = 'err'; iconEmoji = '❌'; }

  toast.innerHTML = `
    <div class="icon ${iconClass}">${iconEmoji}</div>
    <div class="msg">${message}</div>
  `;
  container.appendChild(toast);

  setTimeout(() => {
    toast.classList.add('out');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function requestCamera() {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
    .then(stream => {
      stream.getTracks().forEach(t => t.stop());
      document.getElementById('permScreen').style.display = 'none';
      const mainUI = document.getElementById('mainUI');
      mainUI.style.display = 'flex';
      startScanner();
    })
    .catch(err => {
      alert('카메라 권한이 필요합니다. 설정에서 허용해주세요.');
    });
}

function startScanner() {
  // 페이지 로드 시 카운트 복원
  scanCount = loadCount();
  document.getElementById('countNum').textContent = scanCount;
  scheduleMidnightReset();

  scanner = new Html5Qrcode('reader');
  scanner.start(
    { facingMode: 'user' },
    { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
    onScanSuccess,
    () => {}
  ).catch(err => {
    document.getElementById('status').textContent = '카메라를 시작할 수 없습니다.';
    document.getElementById('status').className = 'status error';
  });
}

function onScanSuccess(decodedText) {
  if (isProcessing) return;

  const status = document.getElementById('status');

  if (scannedSet.has(decodedText)) {
    status.textContent = '⚠ 이미 인식된 QR입니다';
    status.className = 'status error';
    setTimeout(() => {
      status.textContent = 'QR코드를 카메라에 비춰주세요';
      status.className = 'status ready';
    }, 1500);
    return;
  }

  triggerCaptureEffect();

  status.textContent = '✓ QR 인식됨!';
  status.className = 'status success';
  isProcessing = true;

  setTimeout(() => {
    isProcessing = false;
    status.textContent = 'QR코드를 카메라에 비춰주세요';
    status.className = 'status ready';
  }, 1500);

  fetch(decodedText, { method: 'GET', mode: 'cors' })
    .then(r => r.json())
    .then(data => {
      scannedSet.add(decodedText);
      scanCount++;
      document.getElementById('countNum').textContent = scanCount;
      saveCount(scanCount);

      if (data.ok || data.success) {
        const name = data.name || data.studentName || '학생';
        showToast('ok', `<strong>${name}</strong> 출석 완료!`);
      } else if (data.duplicate) {
        const name = data.name || data.studentName || '학생';
        showToast('dup', `<strong>${name}</strong> 이미 출석 처리됨`);
      } else {
        showToast('err', data.message || '처리 중 오류가 발생했습니다.');
      }
    })
    .catch(err => {
      showToast('err', '서버 연결에 실패했습니다.');
    });
}

// 초기 진입: 카메라 권한 이미 있으면 바로 시작
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    stream.getTracks().forEach(t => t.stop());
    document.getElementById('permScreen').style.display = 'none';
    document.getElementById('mainUI').style.display = 'flex';
    startScanner();
  })
  .catch(() => {
    // 권한 없음 → 권한 요청 화면 표시
  });
</script>
</body>
